<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Ray Settings</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #15181e;
      --border-color: #262a33;
      --accent-cyan: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --success-color: #00ba7c;
      --error-color: #f4212e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .header-text p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Badge */
    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 6px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
    }

    .model-tag {
      color: var(--accent-cyan);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.active {
      background: var(--success-color);
      box-shadow: 0 0 6px var(--success-color);
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 9px 34px 9px 10px;
      color: #ffffff;
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .toggle-visibility-btn:hover {
      color: #ffffff;
    }

    /* Model Select Dropdown */
    select.model-select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 8px 30px 8px 10px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select.model-select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    select.model-select option {
      background: #15181e;
      color: #ffffff;
      padding: 6px;
    }

    /* Action Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #000000;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #38f8ff;
      transform: translateY(-0.5px);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #1e222a;
      border-color: #3b424f;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Banner */
    .status-banner {
      display: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      margin-bottom: 12px;
      line-height: 1.4;
      animation: fadeIn 0.15s ease-in;
      word-break: break-word;
    }

    .status-banner.success {
      display: block;
      background: rgba(0, 186, 124, 0.12);
      border: 1px solid rgba(0, 186, 124, 0.3);
      color: var(--success-color);
    }

    .status-banner.error {
      display: block;
      background: rgba(244, 33, 46, 0.12);
      border: 1px solid rgba(244, 33, 46, 0.3);
      color: var(--error-color);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Helper link */
    .links-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      text-align: center;
      font-size: 11.5px;
    }

    .groq-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .groq-link:hover {
      text-decoration: underline;
      opacity: 0.85;
    }

    .remove-btn {
      display: block;
      margin: 8px auto 0 auto;
      background: none;
      border: none;
      color: #656c76;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    .remove-btn:hover {
      color: var(--error-color);
    }
  </style>
</head>
<body>
  <!-- Header with X-Ray Logo -->
  <div class="header">
    <img src="icons/icon48.png" alt="X-Ray Logo" class="logo-img">
    <div class="header-text">
      <h1>X-RAY</h1>
      <p>Account Check &amp; Political Radar</p>
    </div>
  </div>

  <!-- Model Info & Status -->
  <div class="badge-bar">
    <span id="modelDisplay" class="model-tag">⚡ Llama 3.3 70B</span>
    <span id="keyStatusBadge" style="display: flex; align-items: center; gap: 5px; color: var(--text-muted);">
      <span id="keyStatusDot" class="status-dot"></span>
      <span id="keyStatusText">No Key</span>
    </span>
  </div>

  <!-- Status Notification -->
  <div id="statusBanner" class="status-banner"></div>

  <!-- Input Form -->
  <div class="form-group">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
      <label for="apiKeyInput" style="margin-bottom: 0;">GROQ API KEY</label>
      <span style="font-size: 10px; color: #8b949e;">(Free at console.groq.com)</span>
    </div>
    <div class="input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off" spellcheck="false">
      <button type="button" id="toggleVisibilityBtn" class="toggle-visibility-btn" title="Show/Hide API Key">👁️</button>
    </div>
    <p style="font-size: 10.5px; color: var(--text-muted); margin-top: 5px; line-height: 1.35;">
      Groq provides ultra-fast, free inference for open-source AI models via a single API key.
    </p>
  </div>

  <!-- Model Dropdown -->
  <div class="form-group">
    <label for="modelSelect">AI MODEL</label>
    <select id="modelSelect" class="model-select">
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B Versatile (Recommended / Fast)</option>
      <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant (Ultra Fast / High Limit)</option>
      <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 Distill 70B (Advanced Reasoning)</option>
      <option value="mixtral-8x7b-32768">Mixtral 8x7B (Balanced)</option>
      <option value="gemma2-9b-it">Gemma 2 9B (Google)</option>
    </select>
  </div>

  <div class="btn-row">
    <button type="button" id="saveBtn" class="btn btn-primary">💾 Save</button>
    <button type="button" id="testBtn" class="btn btn-secondary">⚡ Test Key</button>
  </div>

  <div class="links-footer">
    <a href="#" id="groqConsoleLink" class="groq-link">Get free Groq API key ↗</a>
    <button type="button" id="removeKeyBtn" class="remove-btn" style="display: none;">Remove API Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
